name: CD - Production Deployment

on:
  workflow_run:
    workflows: ["CI - Test & Build Verification"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Confirm CI completion
        run: |
          echo "=================================================="
          echo "CD Pipeline Triggered"
          echo "Event Name: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI Workflow Name:       ${{ github.event.workflow_run.name }}"
            echo "CI Workflow ID:         ${{ github.event.workflow_run.id }}"
            echo "CI Workflow Conclusion: ${{ github.event.workflow_run.conclusion }}"
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "CRITICAL: CI failed or was cancelled. Aborting CD deployment."
              exit 1
            fi
            echo "CONFIRMED: CI passed all linting, tests, and build checks successfully."
          else
            echo "Manual deployment triggered via workflow_dispatch."
          fi
          echo "=================================================="

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.SERVER_USER || 'ashish' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo ">>> Starting deployment..."
            cd /opt/app/portfolio

            echo ">>> Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Installing dependencies..."
            npm ci

            echo ">>> Rebuilding native SQLite dependency..."
            npm rebuild better-sqlite3

            echo ">>> Building production bundle..."
            npm run build

            echo ">>> Restarting portfolio process..."
            pm2 restart portfolio --update-env || pm2 start ecosystem.config.cjs --env production

            echo ">>> Waiting for application health..."

            HEALTHY=false

            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
                echo "Application is healthy!"
                HEALTHY=true
                break
              fi

              echo "Waiting for application... ($attempt/20)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Application health check failed."
              pm2 list
              pm2 logs portfolio --lines 100 --nostream
              exit 1
            fi

            echo ">>> Saving PM2 process list..."
            pm2 save

            echo ">>> Deployment successfully completed!"
